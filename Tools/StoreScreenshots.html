<!doctype html>
<!--
  StoreScreenshots.html
  Tools

  The App Store's iPhone shots, framed: one scene along a strip ten shots wide (phones, cut-outs of the screens,
  drops, sparkles and hand-drawn notes) under a two-line headline per shot. Each shot is a 660-px window onto the
  strip, so a piece near a seam is drawn in both neighbours and a swipe through the ten reads as one picture.
  Spec: docs/superpowers/specs/2026-11-06-framed-store-screenshots-design.md, §4 and §11.

  Render the ten with `bash Tools/FrameScreenshots.sh`. One shot by hand, from the repository root (the
  throwaway profile keeps a headless run off the owner's own Chrome profile):

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --disable-gpu \
      --hide-scrollbars --force-device-scale-factor=2 --window-size=660,1434 \
      --allow-file-access-from-files --user-data-dir="$(mktemp -d)" --virtual-time-budget=3000 \
      --screenshot=out.png "file://$PWD/Tools/StoreScreenshots.html?shot=01-home"

  THE QUERY. shot=<slug>: draw that shot. measure=<slug>: draw that capture at 0.5, filling the canvas, with every
  rectangle the scene cuts from it outlined and named, and rect=x,y,w,h outlined in yellow beside them.
  in=<directory>, percent-encoded: where the captures are, AppStore/screenshots/captures/iPhone-6.9 by default.
  set=<cut>.<field>:<value>, repeatable: try a rectangle (rect:x,y,w,h), a scale, a position (x, y) or a turn
  (rot) before it goes in the scene. preview: draw a dashed placeholder where a capture or a rectangle is
  missing. font=, hand=, l1=, l2=: another face, another hand, other words. The script passes only shot and in.

  THE STATUS. <body data-status> reads "ready" only once every capture the shot's window needs has decoded at
  1320 x 2868, both faces have loaded, each headline line fits on one line, every rectangle lies inside its
  capture, no cut-out is drawn past 0.5 CSS px a capture pixel (one capture pixel per output pixel at 2x, so a
  cut-out is never upscaled), no cut-out leaves its own shot unless the scene marks it flow, and no cut-out or
  phone covers the headline. Otherwise "error: <what>". The script reads it before it takes the shot.

  HONESTY. A cut-out is the capture's own pixels; nothing is redrawn. Drops, sparkles and notes are decoration
  and carry no figure. The six Premium shots carry the Premium tag (App Review Guideline 2.3.2). No price, no
  "Free", no award, no "AI".

  THE LOOK. The app's Aurora tokens (WaterSurface.swift), copied as the header copies them; the two waves keep
  the app's two frequencies, 1.1 and 1.7, as periods 260 and 168. The rounded face is SF Pro Rounded, the hand
  Bradley Hand Bold, both loaded from macOS's own files.
-->

// Drops and sparkles, in strip px, so they may sit on a seam. [x, y, size, blur] / [x, y, size].
const DROPS = [
  [600, 1120, 46, 0], [700, 1040, 26, 0], [655, 1250, 18, 2], [760, 1190, 34, 0], [40, 380, 22, 2], [590, 470, 30, 0],

  [3560, 1220, 24], [3800, 410, 16], [4480, 1100, 20], [4560, 520, 24], [5140, 450, 18], [6590, 360, 22],

const LIGHTS = [

  [1900, 300, 300, 'var(--magenta)'], [2600, 1150, 320, 'var(--blue)'], [3300, 500, 300, 'var(--cyan)'],
  [3950, 1000, 320, 'var(--magenta)'], [4620, 280, 300, 'var(--blue)'], [5300, 1100, 320, 'var(--cyan)'],

];

const CAPTURE = { w: 1320, h: 2868 };
const CRISP = 0.5;          // CSS px a capture pixel: one capture pixel per output pixel at 2x
const RADIUS = 88;          // LiquidGlass.cornerRadius, 28 pt = 84 px, plus the 4-px margin kept round the rim
const BEZEL = 12;

const P = new URLSearchParams(location.search);
const $ = id => document.getElementById(id);
class Refusal extends Error {}
function fail(what) { throw new Refusal(what); }
function fileURL(path) { return 'file://' + path.split('/').map(encodeURIComponent).join('/'); }
function captureURL(slug) {
  const dir = P.get('in');
  return dir ? fileURL(dir + '/' + slug + '.png') : '../AppStore/screenshots/captures/iPhone-6.9/' + slug + '.png';
}

// Width and height an item takes before its turn, in CSS px.
function size(item) {
  if (item.kind === 'phone') { const h = item.width * CAPTURE.h / CAPTURE.w; return [item.width + 2 * BEZEL, h + 2 * BEZEL]; }
  if (item.kind === 'cut') { const r = item.rect ?? [0, 0, 1000, 400]; return [r[2] * item.scale, r[3] * item.scale]; }
  if (item.kind === 'ripple') return [item.r * 3, item.r * 3];
  return [0, 0];
}
const phoneOf = item => SCENE.find(i => i.kind === 'phone' && i.shot === item.shot);
// An item's centre in strip px and its turn. A cut-out on its phone takes the place its rect has on the screen,
// turned with the phone, then its own dx, dy and rot.
function place(item) {
  if (item.kind === 'ripple') return place(SCENE.find(i => i.name === item.at));
  if (item.kind === 'cut' && item.away) return { x: 660 * item.shot + item.away[0], y: item.away[1], rot: item.rot ?? 0 };
  return origin(item, true);
}
// Where a cut-out's rect sits on its phone's turned screen; with lifted, its own dx, dy and rot added.
function origin(item, lifted) {
  if (item.kind === 'cut' && item.on && item.rect) {
    const p = phoneOf(item), s = p.width / CAPTURE.w, t = p.rot * Math.PI / 180;
    const [x, y, w, h] = item.rect;
    const ox = (x + w / 2 - CAPTURE.w / 2) * s, oy = (y + h / 2 - CAPTURE.h / 2) * s;
    const k = lifted ? 1 : 0;
    return { x: 660 * p.shot + p.x + ox * Math.cos(t) - oy * Math.sin(t) + k * (item.dx ?? 0),
             y: p.y + ox * Math.sin(t) + oy * Math.cos(t) + k * (item.dy ?? 0), rot: p.rot + k * (item.rot ?? 0) };
  }
  return { x: 660 * item.shot + item.x, y: item.y, rot: item.rot ?? 0 };
}
function box(item) {
  const [w, h] = size(item), c = place(item), a = Math.abs(c.rot * Math.PI / 180);
  const bw = w * Math.cos(a) + h * Math.sin(a), bh = w * Math.sin(a) + h * Math.cos(a);
  return { left: c.x - bw / 2, right: c.x + bw / 2, top: c.y - bh / 2, bottom: c.y + bh / 2 };
}

function applySets() {
  for (const set of P.getAll('set')) {
    const m = set.match(/^([a-z]+\.[a-z]+)\.(rect|scale|x|y|rot):(.+)$/);
    if (!m) fail('set= wants name.field:value');
    const item = SCENE.find(i => i.name === m[1]);
    if (!item) fail('set= names no cut-out ' + m[1]);
    const v = m[3].split(',').map(Number);
    if (v.some(Number.isNaN) || (m[2] === 'rect' ? v.length !== 4 : v.length !== 1)) fail('set= wants name.field:value');
    item[m[2]] = m[2] === 'rect' ? v : v[0];
  }
}

function drawWorld(index, visible, loaded) {
  const world = $('world');
  world.style.left = (-660 * index) + 'px';
  for (const [x, y, r, colour] of LIGHTS) {
    const light = document.createElement('div');
    light.className = 'light';
    Object.assign(light.style, { left: (x - r) + 'px', top: (y - r) + 'px', width: 2 * r + 'px', height: 2 * r + 'px',
      background: `radial-gradient(circle, ${colour} 0%, transparent 70%)` });
    world.appendChild(light);
  }
  const wave = (base, amp, period, phase) => {
    let d = `M ${-phase} ${base}`;
    for (let x = -phase; x < 6600 + period; x += period) d += ` q ${period / 4} ${-amp} ${period / 2} 0 t ${period / 2} 0`;
    return d + ` V 260 H ${-phase} Z`;
  };
  world.insertAdjacentHTML('beforeend', `
    <svg class="waves" width="6600" height="260" viewBox="0 0 6600 260">
      <defs><linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#3D9BFF"/><stop offset=".46" stop-color="#1667EA"/><stop offset="1" stop-color="#0B46C9"/>
      </linearGradient></defs>
      <path d="${wave(50, 12, 260, 0)}" fill="url(#water)" opacity=".45"/>
      <path d="${wave(74, 9, 168, 60)}" fill="url(#water)" opacity=".9"/>
    </svg>`);
  for (const [x, y, s, blur] of DROPS) world.appendChild(drop(x, y, s, blur));
  for (const [x, y, s] of SPARKS) world.appendChild(spark(x, y, s));
  for (const item of visible) {
    if (item.kind === 'note') { world.appendChild(note(item)); continue; }
    if (item.kind === 'cut' && item.away && item.rect && loaded.has(item.src)) world.appendChild(slot(item));
    const el = item.kind === 'phone' ? phone(item, loaded) : item.kind === 'cut' ? cut(item, loaded) : ripple();
    const [w, h] = size(item), c = place(item);
    Object.assign(el.style, { left: (c.x - w / 2) + 'px', top: (c.y - h / 2) + 'px', width: w + 'px', height: h + 'px',
      transform: `rotate(${c.rot}deg)`, zIndex: { phone: 1, ripple: 2, cut: 3 }[item.kind] });
    world.appendChild(el);
  }
}

// The place a cut-out that flies away was cut from: a soft dark slot on its phone, so nothing shows twice.
function slot(item) {
  const p = phoneOf(item), s = p.width / CAPTURE.w, c = origin(item, false);
  const [w, h] = [item.rect[2] * s, item.rect[3] * s];
  const el = document.createElement('div');
  el.className = 'item';
  Object.assign(el.style, { left: (c.x - w / 2) + 'px', top: (c.y - h / 2) + 'px', width: w + 'px', height: h + 'px',
    transform: `rotate(${c.rot}deg)`, zIndex: 2, borderRadius: item.shape === 'capsule' ? '999px' : RADIUS * s + 'px',
    background: 'rgba(5, 7, 36, .9)', boxShadow: 'inset 0 6px 14px rgba(0, 0, 0, .55), inset 0 0 0 1px rgba(255, 255, 255, .12)' });
  return el;
}

function placeholder(label) {
  const el = document.createElement('div');
  el.className = 'item placeholder';
  el.textContent = label;
  return el;
}

function phone(item, loaded) {
  if (!loaded.has(item.src)) return placeholder('8 November');
  const el = document.createElement('div');
  el.className = 'item phone';
  el.innerHTML = `<div class="screen"><img src="${captureURL(item.src)}" alt=""><div class="dim"></div><div class="island"></div></div>`;
  return el;
}

function cut(item, loaded) {
  if (!item.rect || !loaded.has(item.src)) return placeholder('8 November');
  const [x, y] = item.rect, s = item.scale;
  const el = document.createElement('div');
  el.className = 'item cut';
  Object.assign(el.style, {
    backgroundImage: `url("${captureURL(item.src)}")`, backgroundSize: `${CAPTURE.w * s}px ${CAPTURE.h * s}px`,
    backgroundPosition: `${-x * s}px ${-y * s}px`,
    borderRadius: item.shape === 'circle' ? '50%' : item.shape === 'capsule' ? '999px' : RADIUS * s + 'px',
  });
  return el;
}

function ripple() {
  const el = document.createElement('div');
  el.className = 'item';
  el.innerHTML = `<svg width="100%" height="100%" viewBox="0 0 300 300" style="overflow: visible">
    <circle cx="150" cy="150" r="72" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="3"/>
    <circle cx="150" cy="150" r="104" fill="none" stroke="rgba(127,246,246,.38)" stroke-width="2.5"/>
    <circle cx="150" cy="150" r="138" fill="none" stroke="rgba(127,246,246,.18)" stroke-width="2"/></svg>`;
  return el;
}

function note(item) {
  const wrap = document.createElement('div');
  const text = document.createElement('div');
  text.className = 'item note';
  text.textContent = item.text;
  Object.assign(text.style, { left: (660 * item.shot + item.x) + 'px', top: item.y + 'px', fontSize: item.size + 'px',
    transform: `translate(-50%, -50%) rotate(${item.rot}deg)`, zIndex: 5 });
  wrap.appendChild(text);
  if (item.arrow) {
    const o = 660 * item.shot, a = item.arrow, target = place(SCENE.find(i => i.name === a.to));
    const sx = item.x + a.from[0], sy = item.y + a.from[1];
    const ex = target.x - o + a.at[0], ey = target.y + a.at[1];
    const cx = (sx + ex) / 2 + a.bend[0], cy = (sy + ey) / 2 + a.bend[1];
    const ang = Math.atan2(ey - cy, ex - cx), k = 16;
    const h1 = [ex - k * Math.cos(ang - 0.5), ey - k * Math.sin(ang - 0.5)];
    const h2 = [ex - k * Math.cos(ang + 0.5), ey - k * Math.sin(ang + 0.5)];
    wrap.insertAdjacentHTML('beforeend', `<svg class="item" style="left:${o}px;top:0;z-index:5;overflow:visible" width="660" height="1434">
      <path d="M ${sx} ${sy} Q ${cx} ${cy} ${ex} ${ey} M ${h1[0]} ${h1[1]} L ${ex} ${ey} L ${h2[0]} ${h2[1]}"
        fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"
        style="filter: drop-shadow(0 2px 6px rgba(6,10,60,.5))"/></svg>`);
  }
  return wrap;
}

function drop(x, y, s, blur) {
  const el = document.createElement('div');
  el.className = 'item';
  const h = s * 1.18;
  Object.assign(el.style, { left: (x - s / 2) + 'px', top: (y - h / 2) + 'px', width: s + 'px', height: h + 'px', zIndex: 4,
    filter: `${blur ? `blur(${blur}px) ` : ''}drop-shadow(0 ${s / 6}px ${s / 4}px rgba(4,6,40,.45))`, opacity: blur ? .75 : 1 });
  const id = 'd' + x + '_' + y;
  el.innerHTML = `<svg width="100%" height="100%" viewBox="0 0 100 118">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#D4FBFF"/><stop offset=".45" stop-color="#3D9BFF"/><stop offset="1" stop-color="#0B46C9"/></linearGradient></defs>
    <path d="M50 2 C50 2 92 52 92 76 A42 42 0 0 1 8 76 C8 52 50 2 50 2 Z" fill="url(#${id})" stroke="rgba(255,255,255,.55)" stroke-width="2"/>
    <ellipse cx="34" cy="74" rx="9" ry="16" fill="rgba(255,255,255,.6)" transform="rotate(18 34 74)"/></svg>`;
  return el;
}

function spark(x, y, s) {
  const el = document.createElement('div');
  el.className = 'item';
  Object.assign(el.style, { left: (x - s / 2) + 'px', top: (y - s / 2) + 'px', width: s + 'px', height: s + 'px', zIndex: 4,
    filter: 'drop-shadow(0 0 8px rgba(127,246,246,.85))' });
  el.innerHTML = `<svg width="100%" height="100%" viewBox="0 0 24 24"><path d="M12 0C13 7 17 11 24 12C17 13 13 17 12 24C11 17 7 13 0 12C7 11 11 7 12 0Z" fill="#E8FFFF"/></svg>`;
  return el;
}

function loadFace(family, path) {
  const face = new FontFace(family, `url("${fileURL(path)}")`, { weight: '100 1000' });
  return face.load().then(f => { document.fonts.add(f); return f; });
}

async function shot(slug) {
  const index = SHOTS.indexOf(slug);
  if (index < 0) fail('unknown shot ' + slug);
  applySets();
  const lo = 660 * index, hi = lo + 660;
  const visible = SCENE.filter(i => { const b = box(i); return b.right > lo && b.left < hi; });
  const preview = P.has('preview');
  for (const item of visible) {
    if (item.kind !== 'cut') continue;
    if (!item.rect && !preview) fail(`${item.name} is not measured yet`);
    if (item.rect) {
      const [x, y, w, h] = item.rect;
      if (x < 0 || y < 0 || x + w > CAPTURE.w || y + h > CAPTURE.h) fail(`${item.name} runs outside its capture`);
    }
    if (item.scale > CRISP) fail(`${item.name} is drawn at ${item.scale}, past one capture pixel per output pixel (${CRISP})`);
  }
  // Every load starts before the first await: headless Chrome's virtual clock waits only for loads the page
  // began while it was loading (measured: a capture asked for after an await was never waited for).
  const sources = [...new Set(visible.filter(i => i.src).map(i => i.src))];
  const loads = sources.map(src => new Promise((ok, no) => {
    const img = new Image(); img.onload = () => ok([src, img]); img.onerror = () => no(src); img.src = captureURL(src);
  }));
  const faces = [loadFace('WB Rounded', P.get('font') ?? '/System/Library/Fonts/SFNSRounded.ttf'),
                 loadFace('WB Hand', P.get('hand') ?? '/System/Library/Fonts/Supplemental/Bradley Hand Bold.ttf')];
  loads.forEach(l => l.catch(() => {})); faces.forEach(f => f.catch(() => {}));

  try { await faces[0]; } catch { fail('the rounded face did not load'); }
  try { await faces[1]; } catch { fail('the hand face did not load'); }
  const loaded = new Set();
  for (const l of loads) {
    try {
      const [src, img] = await l;
      if (img.naturalWidth !== CAPTURE.w || img.naturalHeight !== CAPTURE.h)
        fail(`capture is ${img.naturalWidth} x ${img.naturalHeight}, not ${CAPTURE.w} x ${CAPTURE.h}`);
      loaded.add(src);
    } catch (e) {
      if (e instanceof Refusal) throw e;
      if (!preview) fail('capture did not load: ' + e + '.png');
    }
  }

  const copy = COPY[slug];
  const lines = [P.get('l1') ?? copy.lines[0], P.get('l2') ?? copy.lines[1]];
  $('headline').innerHTML = lines.map(l => `<span class="line">${l}</span>`).join('');
  $('premium').classList.toggle('on', !!copy.premium);
  if (copy.pill) { $('note').textContent = copy.pill; $('note').classList.add('on'); }
  drawWorld(index, visible, loaded);
  await document.fonts.ready;
  [...$('headline').children].forEach((line, i) => {
    if (line.scrollWidth > line.clientWidth + 0.5) fail(`headline line ${i + 1} is too wide`);
  });

  const visibleHead = [...$('head').children].filter(el => getComputedStyle(el).display !== 'none');
  const headBottom = Math.max(...visibleHead.map(el => el.getBoundingClientRect().bottom));
  for (const item of SCENE.filter(i => i.shot === index && (i.kind === 'cut' || i.kind === 'phone'))) {
    const b = box(item);
    if (b.top < headBottom + 6) fail(`${item.name ?? 'the phone'} covers the headline`);
    if (item.kind === 'cut' && !item.flow && (b.left < lo || b.right > hi || b.bottom > 1434))
      fail(`${item.name} runs out of its shot`);
    // A phone may be cropped by the canvas's foot, never by a seam it was not meant to cross.
    if (item.kind === 'phone' && !item.flow && (b.left < lo - 1 || b.right > hi + 1))
      fail(`the phone of ${item.src} runs out of its shot`);
  }
  document.body.dataset.status = 'ready';
}

async function measure(slug) {
  if (!SHOTS.includes(slug)) fail('unknown shot ' + slug);
  applySets();
  const img = new Image();
  const loaded = new Promise((ok, no) => { img.onload = ok; img.onerror = no; });
  img.src = captureURL(slug);
  try { await loaded; } catch { fail('capture did not load: ' + slug + '.png'); }
  $('head').style.display = 'none';
  $('world').style.display = 'none';
  Object.assign(img.style, { position: 'absolute', left: 0, top: 0, width: '660px', height: '1434px' });
  $('canvas').appendChild(img);
  const outline = (rect, label, extra) => {
    const el = document.createElement('div');
    el.className = 'outline' + (extra ? ' ' + extra : '');
    const [x, y, w, h] = rect.map(v => v / 2);
    Object.assign(el.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' });
    el.textContent = label;
    $('canvas').appendChild(el);
  };
  for (const item of SCENE.filter(i => i.kind === 'cut' && i.src === slug && i.rect)) outline(item.rect, item.name);
  if (P.has('rect')) outline(P.get('rect').split(',').map(Number), 'rect', 'try');
  document.body.dataset.status = 'ready';
}

(P.has('measure') ? measure(P.get('measure')) : shot(P.get('shot')))
  .catch(e => { document.body.dataset.status = 'error: ' + (e instanceof Refusal ? e.message : 'the page failed: ' + e.message); });
</script>
</body>
</html>
